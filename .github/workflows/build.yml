name: Build Tauri App
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Download sidecar & ffmpeg
        run: |
          curl -L -o portable.zip https://github.com/jipraks/yt-short-clipper/releases/download/v2.0.7-beta/YTShortClipperV2_2.0.7-beta_x64_portable.zip
          Remove-Item -Recurse -Force src-tauri/binaries -ErrorAction SilentlyContinue
          mkdir -Force src-tauri/binaries
          7z x portable.zip -o"src-tauri/binaries" -y
      - name: Build
        run: npm run tauri build
      - name: Rename binary to match tag
        run: |
          cd src-tauri/target/release/bundle/nsis
          # Rename all exe files to be consistent with the version tag
          for f in *.exe; do
            mv "$f" "YTShortClipperV2_${{ github.ref_name }}_x64-setup.exe"
          done
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true
          gh release create ${{ github.ref_name }} --generate-notes --title "Release ${{ github.ref_name }}"
          gh release upload ${{ github.ref_name }} src-tauri/target/release/bundle/nsis/YTShortClipperV2_${{ github.ref_name }}_x64-setup.exe --clobber
