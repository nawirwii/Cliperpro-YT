name: Build Tauri App
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Download sidecar & ffmpeg
        run: |
          curl -L -o portable.zip https://github.com/jipraks/yt-short-clipper/releases/download/v2.0.7-beta/YTShortClipperV2_2.0.7-beta_x64_portable.zip
          Remove-Item -Recurse -Force src-tauri/binaries -ErrorAction SilentlyContinue
          mkdir -Force src-tauri/binaries
          7z x portable.zip -o"src-tauri/binaries" -y
      - name: Build
        run: npm run tauri build
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release & tag if present (idempotent)
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true
          # Create release without assets
          gh release create ${{ github.ref_name }} --generate-notes --title "Release ${{ github.ref_name }}"
          # Upload assets separately
          gh release upload ${{ github.ref_name }} src-tauri/target/release/bundle/nsis/*.exe --clobber

