name: Build Tauri App
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Download sidecar & ffmpeg
        run: |
          curl -L -o portable.zip https://github.com/jipraks/yt-short-clipper/releases/download/v2.0.7-beta/YTShortClipperV2_2.0.7-beta_x64_portable.zip
          Remove-Item -Recurse -Force src-tauri/binaries -ErrorAction SilentlyContinue
          mkdir -Force src-tauri/binaries
          7z x portable.zip -o"src-tauri/binaries" -y
      - name: Build
        run: npm run tauri build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/nsis/*.exe
